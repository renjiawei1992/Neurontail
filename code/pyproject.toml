[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a5-neurotail"
version = "0.1.0"
description = "Language neurons, causal specificity, and steering in low-resource and extremely low-resource languages"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "A5 NeuronTail" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "tabulate>=0.9",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "torch>=2.2",
  "transformers>=4.45",
  "accelerate>=0.34",
  "datasets>=2.20",
  "peft>=0.13",
  "sentencepiece>=0.2",
  "protobuf>=4.25",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
lid = ["fasttext-wheel>=0.9.2", "langdetect>=1.0.9"]
icu = ["PyICU>=2.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
